services:
  - type: web
    name: aeroflow-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        sync: false
      - key: SERVER_PORT
        value: 8080
